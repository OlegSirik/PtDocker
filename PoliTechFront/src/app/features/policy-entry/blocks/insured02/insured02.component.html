<mat-card class="policy-plaque">
  <mat-card-header>
    <mat-card-title>Застрахованный</mat-card-title>
  </mat-card-header>
  <mat-card-content class="fields-grid">
    <label class="field">
      <span>Фамилия</span>
      <input type="text" [value]="person()?.lastName || ''" (change)="onPersonField('lastName', $event)" />
    </label>
    <label class="field">
      <span>Имя</span>
      <input type="text" [value]="person()?.firstName || ''" (change)="onPersonField('firstName', $event)" />
    </label>
    <label class="field">
      <span>Отчество</span>
      <input type="text" [value]="person()?.middleName || ''" (change)="onPersonField('middleName', $event)" />
    </label>
    <label class="field">
      <span>Дата рождения</span>
      <input type="date" [value]="person()?.birthDate || ''" (change)="onBirthDate($event)" />
    </label>
    <label class="field">
      <span>Пол</span>
      <select [value]="person()?.gender || ''" (change)="onGender($event)">
        <option value="">—</option>
        <option value="M">Мужской</option>
        <option value="F">Женский</option>
      </select>
    </label>
  </mat-card-content>
</mat-card>
